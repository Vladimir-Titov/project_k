services:
  project_k_postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-40321}:5432"

  rustfs-permissions:
    image: alpine:3
    user: "0:0"
    command: ["chown", "10001:10001", "/data", "/logs"]
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOG_DIRECTORY: /logs
      # Local Docker volumes share one physical disk.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  rustfs_data:
  rustfs_logs:
